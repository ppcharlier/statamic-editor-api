name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, exif, fileinfo
          coverage: none

      # No committed lock file: this is a library, so it resolves against the
      # newest compatible Statamic on every run — which is the point.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/pest
